name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CI-only scanners
        run: python -m pip install -r requirements-ci.txt
      - name: Static security checks (medium/high findings fail)
        run: python -m bandit -ll -r pplx_export.py live_verify.py public_verify.py scripts
      - name: Audit resolved runtime and scanner dependencies
        run: python -m pip_audit --strict -r requirements.txt -r requirements-ci.txt --progress-spinner off
