name: Public thread verification

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      thread_url:
        description: Public UUID URL; blank uses the repository's harmless example
        required: false
        type: string
      expected_sha256:
        description: Optional native Markdown SHA-256; blank uses the example baseline only
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: public-thread-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-thread:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    name: public export (Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify public content without account cookies
        env:
          INPUT_THREAD_URL: ${{ inputs.thread_url }}
          INPUT_EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          DEFAULT_THREAD_URL: https://www.perplexity.ai/search/65f1c6ad-8600-4393-aec2-0a4f7d8a1e8d
          DEFAULT_SHA256: c5e710abce41a79780e0d010e2123f5a55707121628f1667e99cb3497f89f78f
          PYTHONHASHSEED: random
        shell: bash
        run: |
          set -euo pipefail
          thread_url="${INPUT_THREAD_URL:-$DEFAULT_THREAD_URL}"
          expected_sha256="$INPUT_EXPECTED_SHA256"
          if [[ -z "$INPUT_THREAD_URL" && -z "$expected_sha256" ]]; then
            expected_sha256="$DEFAULT_SHA256"
          fi
          args=(--thread-url "$thread_url" --native-export --output "$RUNNER_TEMP/perplexity-public-export.md")
          if [[ -n "$expected_sha256" ]]; then
            args+=(--expected-sha256 "$expected_sha256")
          fi
          python public_verify.py "${args[@]}"
      - name: Delete temporary export
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/perplexity-public-export.md"
